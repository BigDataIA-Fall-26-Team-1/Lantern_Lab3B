# Lab 3B / Case Study 3B parameters. Every threshold the code uses lives here.
data:
  use_fixture: true
  panel: data/fixture/panel_2p.csv         # real mode: your CS2B two-period panel (see Case Study 3B, Section 4)
  truth: data/fixture/ground_truth.csv     # fixture only
  fixture_dir: data/fixture
  mandates: data/fixture/mandates.json     # real mode: copy and point positions at BDCs in your panel
  registry: data/fixture/registry.json
agent:
  seed: agent_seed                         # copied to agent/ by notebook 00; edit agent/, never the seed
  workspace: agent
  principal: priya
context:
  budgets: {soul: 300, principal: 400, agents: 300, mandate: 400, watchlist: 200, skills_index: 320, memory: 500}   # skills_index raised 200 -> 320 for six skills (Part 3)
budget:
  max_steps_per_task: 8
  usd_cap_per_task: 0.50
  token_cap_per_task: 60000
heartbeat:
  materiality: {markdown_points: 5.0, pik_points: 0.5, extension_months: 6}
  quiet_hours: {start: 21, end: 7}
  hygiene: {stale_days: 30, reporting_window_business_days: 5}   # hygiene_dag (HEARTBEAT.md)
  timezone: America/New_York
approvals:
  ttl_minutes: 30
actions:                                   # the policy engine (Part 6): action class -> policy, read on every call
  policy: {READ: auto, DRAFT: auto, INTERNAL_WRITE: notify, EXTERNAL_SEND: approve, CONTROL: principal, DESTRUCTIVE: forbidden}
  overrides: {watchlist_write: approve}    # clients rely on the watchlist
sec:
  user_agent: "Your Name your.email@northeastern.edu"   # SEC requires a real name and email
  base_url: "https://www.sec.gov/files/datastandardsinnovation/data/business-development-company-bdc-data-sets/"
  hosts: [www.sec.gov, data.sec.gov]
prices:                                    # illustrative: replace with your provider's current prices
  usd_per_mtok_in: 0.40
  usd_per_mtok_out: 1.60
economics:                                 # assumptions: state and justify your own
  analyst_hours_per_review: 3.0
  analyst_rate_usd: 120.0
  # Part 8 assumptions (stated, not measured): one monthly release, so per mandate-month
  tasks_per_mandate_month: {client_note: 1, bdc_review_per_held_bdc: 1, brief: 1}
  false_alert_minutes: 15                  # ASSUMPTION: Priya's time lost per false alert
  leak_cost_usd: 250000                    # ASSUMPTION, a placeholder: legal review, client remediation, relationship risk
